<div class="top-layout">
  <aside class="side-menu">
    <span class="brand-mark">C</span>
  </aside>

  <main class="top-content">
    <!-- Primer bloque: título y botones -->
    <header class="nav-block">
    <span class="eyebrow">CINEMAPP / SELECCIÓN</span>

    <h1>Top 3 películas</h1>
  </header>

    <!-- Tres bloques restantes: películas -->
    @for (movie of topMovies; track movie.id; let i = $index) {
      <a class="movie-block" [routerLink]="['/movies', movie.id]">
        <img [src]="movie.poster" [alt]="movie.alt" />

        <div class="movie-overlay">

          <div class="movie-info">
            <h2>{{ movie.title }}</h2>
            <p>{{ movie.year }} / {{ movie.genre }}</p>
          </div>
        </div>
      </a>
    }
  </main>
</div>
